{% extends "admin/base.html" %}
{% block content %}
<div class="container mt-4">
    <h2 class="mb-4">Manage Exercises</h2>

    <form method="POST" class="mb-4">
        <div class="row">
            <div class="col-md-4 mb-3">
                <input type="text" name="name" class="form-control" placeholder="Exercise Name" required>
            </div>
            <div class="col-md-4 mb-3">
                <input type="text" name="muscle_group" class="form-control" placeholder="Muscle Group" required>
            </div>
            <div class="col-md-4 mb-3">
                <input type="text" name="primary_muscle" class="form-control" placeholder="Primary Muscle" required>
            </div>
            <div class="col-md-4 mb-3">
                <input type="text" name="equipment" class="form-control" placeholder="Equipment" required>
            </div>
            <div class="col-md-4 mb-3">
                <input type="text" name="type" class="form-control" placeholder="Type" required>
            </div>
            <div class="col-md-4 mb-3">
                <input type="text" name="difficulty" class="form-control" placeholder="Difficulty" required>
            </div>
        </div>
        <button class="btn btn-primary">Add Exercise</button>
    </form>

    <table class="table table-dark table-striped">
        <thead>
            <tr>
                <th>ID</th>
                <th>Name</th>
                <th>Muscle Group</th>
                <th>Primary Muscle</th>
                <th>Equipment</th>
                <th>Type</th>
                <th>Difficulty</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            {% for ex in exercises %}
            <tr>
                <td>{{ ex[0] }}</td>
                <td>{{ ex[1] }}</td>
                <td>{{ ex[2] }}</td>
                <td>{{ ex[3] }}</td>
                <td>{{ ex[4] }}</td>
                <td>{{ ex[5] }}</td>
                <td>{{ ex[6] }}</td>
                <td>
                    <a href="/admin/edit_exercise/{{ ex[0] }}" class="btn btn-sm btn-warning">Edit</a>
                    <a href="/admin/delete_exercise/{{ ex[0] }}" class="btn btn-sm btn-danger"
                    onclick="return confirm('Are you sure you want to delete this exercise?')">Delete</a>
                </td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
