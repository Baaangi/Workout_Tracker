<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<div class="container-fluid">
    <div class="row">
        <div class="col-3 bg-secondary p-3" style="min-height: 100vh;">
            <h3 class="text-warning mb-4">Admin Panel</h3>
            <ul class="nav flex-column">
                <li class="nav-item"><a href="/admin" class="nav-link text-white">Dashboard</a></li>
                <li class="nav-item"><a href="/admin/users" class="nav-link text-white">Manage Users</a></li>
                <li class="nav-item"><a href="/admin/exercises" class="nav-link text-white">Manage Exercises</a></li>
                <li class="nav-item"><a href="/admin/logs" class="nav-link text-white">Workout Logs</a></li>
                <li class="nav-item"><a href="/dashboard" class="nav-link text-white">Back to User Dashboard</a></li>
                <li class="nav-item"><a href="/logout" class="nav-link text-danger">Logout</a></li>
            </ul>
        </div>
        <div class="col-9 p-4">
            {% block content %}{% endblock %}
        </div>
    </div>
</div>
</body>
</html>
