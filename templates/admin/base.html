<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Admin Panel</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">


    <style>
        /* Sidebar + nav link polish */
        .sidebar {
            position: sticky;
            top: 0;
            min-height: 100vh;
        }
        .sidebar .nav-link {
            border-radius: .5rem;
            padding: .5rem .75rem;
            color: var(--bs-body-color);
        }
        .sidebar .nav-link:hover {
            background: var(--bs-primary-bg-subtle);
            color: var(--bs-primary-text-emphasis);
        }
        .sidebar .nav-link.active {
            background: var(--bs-primary-bg-subtle);
            color: var(--bs-primary-text-emphasis);
            font-weight: 600;
        }

        /* Main content surface for contrast against the body background */
        .content-surface {
            background: var(--bs-body-tertiary);
            border-radius: 1rem;
            box-shadow: 0 0.25rem 0.75rem rgba(0,0,0,.2);
        }
    </style>
</head>
<body class="min-vh-100">

<div class="container-fluid">
    <div class="row g-0">
        <!-- Sidebar -->
        <aside class="col-12 col-md-3 col-lg-2 sidebar bg-body-tertiary border-end p-3">
            <h3 class="mb-4 text" style="color: white;">Admin Panel</h3>
            <nav class="nav flex-column gap-1">
                <a href="/admin" class="nav-link {% if request.path == '/admin' %}active{% endif %}">Dashboard</a>
                <a href="/admin/users" class="nav-link {% if request.path.startswith('/admin/users') %}active{% endif %}">Manage Users</a>
                <a href="/admin/exercises" class="nav-link {% if request.path.startswith('/admin/exercises') %}active{% endif %}">Manage Exercises</a>
                <a href="/admin/foods" class="nav-link {% if request.path.startswith('/admin/foods') %}active{% endif %}">Manage Foods</a>
                <a href="/admin/logs" class="nav-link {% if request.path.startswith('/admin/logs') %}active{% endif %}">Workout Logs</a>
                <div class="border-top my-2"></div>
                <a href="/dashboard" class="nav-link">Back to User Dashboard</a>
                <a href="/logout" class="nav-link text-danger">Logout</a>
            </nav>

        </aside>

        <!-- Main content -->
        <main class="col-12 col-md-9 col-lg-10 p-4">
            <div class="content-surface p-4">
                {% block content %}{% endblock %}
            </div>
        </main>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
