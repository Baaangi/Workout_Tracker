{% extends 'admin/base.html' %}

{% block content %}
<div class="mb-4">
    <h2 class="fw-bold mb-1">Welcome, {{ session['user'] }}</h2>
    <p class="text-secondary">Manage your application using the tools below.</p>
</div>

<div class="row g-4">
    <!-- Users -->
    <div class="col-md-4">
        <div class="card bg-dark text-light shadow-sm border-0">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="card-title mb-1">Users</h5>
                    <p class="card-text fs-4 fw-bold">{{ user_count }}</p>
                </div>
                <div class="text-primary fs-2">
                    <i class="bi bi-people-fill"></i>
                </div>
            </div>
            <a href="/admin/users" class="card-footer text-center text-decoration-none text-warning">
                Manage Users →
            </a>
        </div>
    </div>

    <!-- Exercises -->
    <div class="col-md-4">
        <div class="card bg-dark text-light shadow-sm border-0">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="card-title mb-1">Exercises</h5>
                    <p class="card-text fs-4 fw-bold">{{ exercise_count }}</p>
                </div>
                <div class="text-success fs-2">
                    <i class="bi bi-bar-chart-fill"></i>
                </div>
            </div>
            <a href="/admin/exercises" class="card-footer text-center text-decoration-none text-warning">
                Manage Exercises →
            </a>
        </div>
    </div>

    <!-- Workout Logs -->
    <div class="col-md-4">
        <div class="card bg-dark text-light shadow-sm border-0">
            <div class="card-body d-flex justify-content-between align-items-center">
                <div>
                    <h5 class="card-title mb-1">Workout Logs</h5>
                    <p class="card-text fs-4 fw-bold">{{ log_count }}</p>
                </div>
                <div class="text-info fs-2">
                    <i class="bi bi-journal-text"></i>
                </div>
            </div>
            <a href="/admin/logs" class="card-footer text-center text-decoration-none text-warning">
                View Logs →
            </a>
        </div>
    </div>
</div>
{% endblock %}
