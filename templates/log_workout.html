{% extends "base.html" %}
{% block content %}

    <div class="container-fluid mt-4">
        <h2 class="text-center" style="font-family: 'Bebas Neue', sans-serif; color: var(--primary);">Log Workout</h2>
        
        <div class="text-center mb-3">
            <input type="date" id="date" name="date" class="form-control d-inline-block text-center"
                style="max-width: 200px; background-color: var(--dark); color: white; border: 1px solid var(--primary);"
                value="{{ current_date }}" required>
        </div>

        <div class="row g-4">
            <div class="col-md-4">
                <div class="card bg-dark text-white rouded-4 shadow p-3" style="max-height: 80vh; overflow-y: auto">
                    <h4 style="font-family: 'Bebas Neue', sans-serif;">Exercises</h4>

                    <input type="text" id="searchInput" onkeyup="filterExercises()" placeholder="Search exercises"
                    class="form-control mb-2" style="background-color: var(--light-dark); color:white; border: 1px solid var(--grey);">

                    <select id="muscleFilter" onchange="filterExercises()" class="form-select mb-3"
                        style="background-color: var(--light-dark); color: white; border: 1px solid var(--grey);">
                        <option value="">All Muscle Groups</option>
                        <option value="Chest">Chest</option>
                        <option value="Back">Back</option>
                        <option value="Arms">Arms</option>
                        <option value="Legs">Legs</option>
                        <option value="Shoulders">Shoulders</option>
                        <option value="Core">Core</option>
                    </select>
                    <div id="exerciseList" class="d-grid gap-2">
                        {% for ex in exercise %}
                        <button class="btn btn-outline-light text-start"
                            style="font-family: 'Inter'; border-color: var(--grey);"
                            data-muscle="{{ ex[1] }}"
                            onclick="selectExercise('{{ ex[0] }}')">
                        <strong>{{ ex[0] }}</strong> <br><small class="text-muted">{{ ex[1] }}</small>
                        </button>
                    {% endfor %}
                    </div>
                </div>
            </div>

            <div class="col-md-8">
                <div id="workout-entries"></div>

                <button type="button" class="btn btn-teal mt-3" id="saveWorkoutBtn">Save Workout</button>
            </div>
        </div>
    </div>

     <script>
        function filterExercises() {
            const input = document.getElementById("searchInput").value.trim().toLowerCase();
            const muscleFilter = document.getElementById("muscleFilter").value.trim().toLowerCase();
            const buttons = document.querySelectorAll("#exerciseList button");

            buttons.forEach(button => {
                const nameEl = button.querySelector("strong");
                const muscle = button.getAttribute("data-muscle")?.toLowerCase() || "";
                const name = nameEl?.textContent.trim().toLowerCase() || "";

                const matchesText = input === "" || name.split(' ').some(word => word.startsWith(input));
                const matchesMuscle = muscleFilter === "" || muscle === muscleFilter;

                button.style.display = (matchesText && matchesMuscle) ? "" : "none";
            });
        }
        
        function selectExercise(name){
            if (document.querySelector(`[data-exercise="${name}"]`)) {
                alert("Exercise already added");
                return;
            }

            const container = document.getElementById("workout-entries");

            const exerciseDiv = document.createElement("div");
            exerciseDiv.setAttribute("data-exercise", name);
            exerciseDiv.className = "workout-card";
            exerciseDiv.setAttribute("data-exercise", name);

            exerciseDiv.innerHTML = `
                <div class="d-flex justify-content-between align-items-center mb-2">
                    <h5 style="font-family: 'Bebas Neue'; margin: 0;">${name}</h5>
                    <button class="btn btn-sm btn-outline-danger" onclick="removeExercise(this)">Remove</button>
                </div>
                <div class="sets"></div>
                <button class="btn btn-sm btn-outline-teal mt-2" onclick="addSet(this)">Add Set</button>
            `;

            container.appendChild(exerciseDiv);
            addSet(exerciseDiv.querySelector(".sets"));
        }

        function removeExercise(btn) {
            btn.closest(".workout-card").remove();
        }

        function addSet(btnOrContainer) {
            let setsDiv = btnOrContainer.classList.contains("sets") ? btnOrContainer : btnOrContainer.previousElementSibling;
            const setCount = setsDiv.children.length + 1;

            const setDiv = document.createElement("div");
            setDiv.className = "row g-2 align-items-center mb-2";

            setDiv.innerHTML = `
                <div class="col-auto"><label>Set ${setCount}:</label></div>
                <div class="col"><input type="number" class="form-control reps" placeholder="Reps" min="1"></div>
                <div class="col"><input type="number" class="form-control weight" placeholder="Weight (kg)" min="0"></div>
                <div class="col"><input type="text" class="form-control notes" placeholder="Notes"></div>
                <div class="col-auto"><button class="btn btn-sm btn-danger" onclick="removeSet(this)">X</button></div>
            `;

            setsDiv.appendChild(setDiv);
        }

        function removeSet(button) {
            const setDiv = button.closest(".row");
            const setsDiv = setDiv.parentElement;
            setDiv.remove();
            [...setsDiv.children].forEach((setEl, i) => {
                setEl.querySelector("label").textContent = `Set ${i + 1}:`;
            });
        }

        document.getElementById("saveWorkoutBtn").addEventListener("click", () => {
            const date = document.getElementById("date").value;
            if (!date) {
            alert("Please select a date");
            return;
            }

            const entries = [];
            document.querySelectorAll("[data-exercise]").forEach(exDiv => {
            const exercise = exDiv.getAttribute("data-exercise");
            const sets = [];
            exDiv.querySelectorAll(".sets > div").forEach(setDiv => {
                const reps = setDiv.querySelector(".reps").value;
                const weight = setDiv.querySelector(".weight").value;
                const notes = setDiv.querySelector(".notes").value;

                if (!reps) return;

                sets.push({
                reps: parseInt(reps),
                weight: weight ? parseFloat(weight) : 0,
                notes: notes || ""
                });
            });

            if (sets.length) {
                entries.push({ exercise, sets });
            }
            });

            if (entries.length === 0) {
            alert("Add at least one set");
            return;
            }

            fetch("/log_workout", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ date, entries }),
            })
            .then(res => res.json())
            .then(data => {
            if (data.success) {
                alert("Workout logged successfully!");
                // Optionally clear the form
                document.getElementById("workout-entries").innerHTML = "";
            } else {
                alert("Failed to log workout");
            }
            })
            .catch(err => alert("Error: " + err));
        });

    const prefilledExercises = {{ prefilled|tojson }};

        window.addEventListener("DOMContentLoaded", () => {
            if (prefilledExercises.length > 0) {
            prefilledExercises.forEach(name => selectExercise(name));
            }
        });

     </script>

     <style>
        .form-control.reps::placeholder,
        .form-control.weight::placeholder,
        .form-control.notes::placeholder {
            color: #aaa; /* softer placeholder */
        }
    </style>




{% endblock %}
